<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de leads — Dallminas e Diprotec Minas</title>
<style>
:root{
  --ink:#16222E; --mut:#5C6B79; --paper:#F1F4F6; --surf:#FFFFFF; --line:#D8DFE5; --track:#E8EDF1;
  --acc:#0B6E8A; --acc-ink:#FFFFFF; --acc-soft:#E1F0F4; --warn:#9A5B00; --warn-bg:#FFF3DC; --bad:#A32D2D; --bad-bg:#FBE9E9; --ok:#1F6B4F; --ok-bg:#E3F3EB;
  --ga:#2B8A6E; --meta:#5B4FCF; --ig:#C13584; --fb:#3B6FD8;
  --r:6px; --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:18px} h2{font-size:20px} h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mut{color:var(--mut)} .num{text-align:right;font-variant-numeric:tabular-nums} .sm{font-size:12px}
.sr{position:absolute;left:-9999px}

/* topo */
.top{background:var(--surf);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:14px}
.logo{height:40px;min-width:120px;max-width:200px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:var(--r);background:none;padding:2px 10px;font-weight:600;color:var(--mut)}
.logo img{max-height:34px;max-width:180px;display:block}
.logo.has{border-style:solid;border-color:transparent}
.titulo{flex:1;min-width:220px}
.titulo .sub{color:var(--mut);font-size:12px}
.salvo{font-size:12px;color:var(--mut);text-align:right}
.salvo b{color:var(--ok);font-weight:600}
.aviso-global{background:var(--bad-bg);color:var(--bad);padding:8px 20px;font-size:13px}

/* navegação */
.nav{background:var(--surf);padding:0 20px;display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px 9px;color:var(--mut);font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-current=page]{color:var(--acc);border-bottom-color:var(--acc)}
.tab .n{font-weight:400;font-size:11px;margin-left:6px;background:var(--track);color:var(--mut);border-radius:9px;padding:1px 7px}
.nav .sep{width:1px;background:var(--line);align-self:stretch;margin:8px 10px}
.sub-nav{background:var(--paper);padding:10px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:none;border:1px solid transparent;border-radius:16px;padding:5px 14px;color:var(--mut);font-weight:600}
.pill:hover{background:var(--track)}
.pill[aria-current=page]{background:var(--ink);color:#fff}

main{padding:16px 20px 60px;max-width:1280px;margin:0 auto}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.head .mut{font-size:13px}
.head .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.panel>h3{margin-bottom:2px} .panel>.hint{color:var(--mut);font-size:12px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2>.panel{margin-bottom:0}
.gap{margin-bottom:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.top{gap:12px}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi-v{font-size:25px;font-weight:600;line-height:1.1;white-space:nowrap}
.kpi-l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi-s{font-size:12px;color:var(--ink);margin-top:2px;min-height:17px}
@media(max-width:700px){.kpi{border-bottom:1px solid var(--line)}}

/* botões e campos */
.btn{border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:7px 13px;font-weight:600}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(.93)}
.btn.bad{color:var(--bad);border-color:#E3B8B8}
.btn.sm{padding:3px 9px;font-size:12px}
.lnk{background:none;border:0;color:var(--acc);padding:0;font-weight:600;text-decoration:underline}
input[type=text],input[type=date],input[type=time],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid #BCC6CF;border-radius:var(--r);padding:7px 9px;background:#fff}
textarea{min-height:64px;resize:vertical}
input:disabled,select:disabled{background:var(--track);color:var(--mut)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .f{width:auto;min-width:130px}
.toolbar .busca{width:220px}
.cnt{color:var(--mut);font-size:13px;margin-left:auto}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{position:sticky;top:0;background:#F7F9FA;text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid #EDF1F4;vertical-align:top}
.t tbody tr:hover{background:#F7FAFB}
.t tr.clk{cursor:pointer}
.t .nw{white-space:nowrap}
.t td.cut{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t td.num,.t th.num{text-align:right}
.t td.num{white-space:nowrap}
.t .badge-low{display:block;width:max-content;margin:2px 0 0 auto}
.t tfoot td{font-weight:600;background:#F7F9FA;border-top:1px solid var(--line)}
.t tr.sub td:first-child{padding-left:26px}
.t tr.tot td{font-weight:600;background:#F7F9FA}
.t td.low,.cel.low{color:var(--mut)}
.badge-low{display:inline-block;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 5px;margin-left:4px;white-space:nowrap}
.ch{display:inline-block;border-radius:3px;padding:0 6px;font-size:11px;font-weight:600;color:#fff}
.ch.GA{background:var(--ga)} .ch.IG{background:var(--ig)} .ch.FB{background:var(--fb)} .ch.SEM{background:#8A97A3}
.st{display:inline-block;border-radius:3px;padding:0 6px;font-size:12px;background:var(--track);white-space:nowrap}
.st.ganha{background:var(--ok-bg);color:var(--ok)} .st.perdida,.st.descartada{background:var(--bad-bg);color:var(--bad)}
.st.negociacao{background:var(--acc-soft);color:var(--acc)} .st.duplicado{background:var(--warn-bg);color:var(--warn)}
.flag{color:var(--warn);font-size:12px;white-space:nowrap}
.tempo-x{color:var(--bad);font-size:12px}

/* gráficos */
figure.chart{margin:0}
figure.chart svg{width:100%;max-width:760px;height:auto;display:block}
.ax{font-size:11px;fill:var(--mut)} .vl{font-size:11px;fill:var(--ink);font-weight:600} .lb{font-size:12px;fill:var(--ink)} .vl2{font-size:12px;fill:var(--ink);font-weight:600} .vl2 .sub{font-weight:400;fill:var(--mut);font-size:11px} .dc{font-size:22px;font-weight:600;fill:var(--ink)}
ul.legend{list-style:none;padding:0;margin:4px 0 0;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
ul.legend i,.legtab i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
figure.rosca{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
figure.rosca svg.donut{width:170px;flex:none}
.legtab{border-collapse:collapse;font-size:13px;flex:1;min-width:200px}
.legtab td{padding:3px 6px;border-bottom:1px solid #EDF1F4}

/* avisos */
.nota{background:var(--acc-soft);border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13px;margin-bottom:12px}
.nota.warn{background:var(--warn-bg);border-color:var(--warn);color:#5C3A00}
.nota.ok{background:var(--ok-bg);border-color:var(--ok)}
.vazio{border:1px dashed #BCC6CF;border-radius:var(--r);padding:28px;text-align:center;color:var(--mut);background:var(--surf)}
.dq{list-style:none;margin:0;padding:0}
.dq li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #EDF1F4;font-size:13px}
.dq li:last-child{border:0}
.barra{height:8px;background:var(--track);border-radius:4px;overflow:hidden;min-width:90px}
.barra>i{display:block;height:100%;background:var(--acc)}
.barra>i.ok{background:var(--ok)}
.leitura p{margin:0 0 8px;max-width:78ch}

/* modal */
.ov{position:fixed;inset:0;background:rgba(22,34,46,.5);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:20}
.modal{background:var(--surf);border-radius:8px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.sm{max-width:460px}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal form,.modal .body{padding:16px 18px}
.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fg>div{grid-column:span 2} .fg>.s3{grid-column:span 3} .fg>.s4{grid-column:span 4} .fg>.s6{grid-column:span 6}
@media(max-width:620px){.fg>div,.fg>.s3,.fg>.s4{grid-column:span 6}}
.rodape{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.rodape .esq{margin-right:auto}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.calc{background:var(--track);border-radius:var(--r);padding:7px 10px;min-height:35px;font-weight:600}
.calc small{display:block;font-weight:400;color:var(--mut)}
.orig{font-size:12px;color:var(--mut);background:#F7F9FA;border-radius:var(--r);padding:8px 10px;word-break:break-word}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
.metas td input{width:110px;text-align:right}
@media print{.nav,.sub-nav,.top .salvo,.acoes,.toolbar{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

(function (root) {

function niceMax(v, inteiro) {
  if (!(v > 0)) return inteiro ? 4 : 1;
  if (inteiro && v <= 20) return Math.max(4, Math.ceil(v / 4) * 4);
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  const c = [1, 1.2, 1.6, 2, 2.4, 3.2, 4, 5, 6, 8, 10].find(x => x >= f - 1e-9);

function hbarras({ rows, fmt = v => v, max, labelW = 150, rightW = 150, rowH = 34, titulo = '' }) {

    g += `<rect x="${m.l}" y="${y + 6}" width="${iw}" height="${rowH - 12}" rx="3" fill="var(--track)"/>`;
    if (r.value != null) g += `<rect x="${m.l}" y="${y + 6}" width="${w}" height="${rowH - 12}" rx="3" fill="${r.color || PALETA[0]}"><title>${esc(r.label)}: ${esc(fmt(r.value))}</title></rect>`;

  <div class="tw"><table class="t"><thead><tr><th>Cliente</th><th>Lead vinculado</th><th class="num">Valor</th><th>Status</th><th>Resultado final</th><th>Motivo da perda</th><th>Data</th><th></th></tr></thead><tbody>${linhas}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${fmtBRL(R.total)}</td><td colspan="5"></td></tr></tfoot></table></div>`;
}
function abrirOrc(id) {
  const st = S(), o = id ? st.orcamentos.find(x => x.id === id) : { id: null, mes: ui.mes, leadId: '', cliente: '', valor: '', data: '', status: 'aberto', resultado: '', motivo: '', obs: '' };
  if (!o) return;
  const leads = C.leadsDoMes(st, ui.mes).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const corpo = `<form id="orc-form" autocomplete="off" novalidate><div id="m-err" class="err" role="alert" hidden></div><div class="fg">
    <div class="s6"><label for="of-lead">Lead vinculado (opcional)</label><select id="of-lead"><option value="">— nenhum —</option>${leads.map(l => opt(l.id, l.nome + (l.empresa && l.empresa !== l.nome ? ' — ' + l.empresa : ''), o.leadId)).join('')}</select></div>
    <div class="s4"><label for="of-cli">Cliente *</label><input type="text" id="of-cli" value="${esc(o.cliente)}"></div>
    <div><label for="of-val">Valor (R$) *</label><input type="text" inputmode="decimal" id="of-val" value="${o.valor === '' || o.valor == null ? '' : esc(String(o.valor).replace('.', ','))}" placeholder="0,00"></div>
    <div><label for="of-data">Data do orçamento</label><input type="date" id="of-data" value="${esc(o.data)}"></div>
    <div><label for="of-st">Status</label><select id="of-st">${opt('aberto', 'Em aberto', o.status)}${opt('fechado', 'Fechado', o.status)}</select></div>
    <div><label for="of-res">Resultado final</label><select id="of-res"><option value="">—</option>${opt('ganho', 'Ganho', o.resultado)}${opt('perdido', 'Perdido', o.resultado)}</select></div>
    <div class="s6"><label for="of-mot">Motivo da perda</label><input type="text" id="of-mot" value="${esc(o.motivo)}" placeholder="Obrigatório quando o resultado for perdido"></div>
    <div class="s6"><label for="of-obs">Observações</label><textarea id="of-obs">${esc(o.obs)}</textarea></div></div>
  <div class="rodape">${o.id ? '<button type="button" class="btn bad esq" data-act="excluir-orc-modal">Excluir orçamento</button>' : ''}<button type="button" class="btn" data-act="fechar-modal">Cancelar</button><button type="submit" class="btn pri">Salvar orçamento</button></div>
  <input type="hidden" id="of-id" value="${esc(o.id || '')}"></form>`;
  modal(o.id ? 'Editar orçamento' : 'Novo orçamento', corpo, 'sm'); orcDeps();
}
function orcDeps() {
  const fech = $('of-st').value === 'fechado'; $('of-res').disabled = !fech; if (!fech) $('of-res').value = '';
  const perd = $('of-res').value === 'perdido' && fech; $('of-mot').disabled = !perd; if (!perd) $('of-mot').value = '';
}
function salvarOrc() {
  const st = S(), id = $('of-id').value, e = [], valor = C.parseValor($('of-val').value);
  const o = { leadId: $('of-lead').value, cliente: $('of-cli').value.trim(), valor, data: $('of-data').value, status: $('of-st').value, resultado: $('of-res').value, motivo: $('of-mot').value.trim(), obs: $('of-obs').value.trim() };
  if (!o.cliente) e.push('Informe o cliente.');
  if (valor == null || valor < 0) e.push('Informe um valor válido, por exemplo 1.250,00.');
  if (o.status === 'fechado' && !o.resultado) e.push('Orçamento fechado precisa de resultado final (ganho ou perdido).');
  if (o.resultado === 'perdido' && !o.motivo) e.push('Informe o motivo da perda.');
  const ant = id ? st.orcamentos.find(x => x.id === id) : null;
  const novo = { ...(ant || {}), ...o, mes: ant ? ant.mes : ui.mes, id: ant ? ant.id : C.uid() };
  if (valor != null && o.cliente) { const d = C.orcDuplicado(st, novo); if (d) e.push(`Já existe um orçamento igual neste mês (${d.cliente}, ${fmtBRL(d.valor)}). Edite o existente em vez de duplicar.`); }
  if (e.length) return erro(e);
  if (ant) st.orcamentos[st.orcamentos.indexOf(ant)] = novo; else st.orcamentos.push(novo);
  App.salvar(); fechar(); App.render(); App.toast('Orçamento salvo');
}
function excluirOrc(id) {
  const o = S().orcamentos.find(x => x.id === id); if (!o) return;
  if (!confirm(`Excluir o orçamento de "${o.cliente}" (${fmtBRL(o.valor)})?`)) return;
  S().orcamentos = S().orcamentos.filter(x => x.id !== id); App.salvar(); fechar(); App.render(); App.toast('Orçamento excluído');
}

/* ---------- FORA DO HORÁRIO COMERCIAL ---------- */
function pageFora() {
  const st = S(), ix = idx(), m = C.mesObj(ui.mes);
  const base = (ui.fhTodos ? st.leads : C.leadsDoMes(st, ui.mes)).filter(l => C.catOf(ix, l.status) !== 'duplicado');
  const com = base.filter(l => C.periodoDe(l)), fh = com.filter(l => C.periodoDe(l) === 'fh'), hc = com.filter(l => C.periodoDe(l) === 'hc');
  const escopo = ui.fhTodos ? 'Todos os meses' : m.nome;
  const head = `<div class="head"><h2>Leads fora do horário comercial · ${esc(escopo)}</h2><div class="acoes"><button class="btn${ui.fhTodos ? '' : ' pri'}" data-act="fh-escopo" data-v="mes">Somente ${m.nome}</button><button class="btn${ui.fhTodos ? ' pri' : ''}" data-act="fh-escopo" data-v="todos">Todos os meses</button></div></div>
  <div class="nota">Fora do horário: leads recebidos entre <b>17h01 e 06h59</b>. Horário comercial: <b>07h00 às 17h00</b>. Considera só o horário de chegada (Brasília), sem separar fins de semana. Amostra mínima para comparar: ${MIN_LEADS} leads por grupo e ${MIN_TEMPOS} tempos válidos para médias.</div>`;
  if (!base.length) return head + '<div class="vazio">Nenhum lead neste recorte.</div>';
  const cob = `<div class="nota ${com.length === base.length ? 'ok' : 'warn'}"><b>Cobertura dos dados:</b> ${com.length} de ${base.length} leads (${fmtPct(com.length, base.length, 0)}) têm horário de chegada e entram nesta análise${base.length - com.length ? `; ${base.length - com.length} ficam de fora por falta de horário` : ''}.</div>`;
  if (!com.length) return head + cob + `<div class="vazio"><p>Nenhum lead deste recorte tem horário de chegada, então não há o que analisar. Abra a aba Leads e preencha o horário de chegada (e o da 1ª resposta) para liberar o relatório.</p><button class="btn pri" data-act="pagina" data-p="leads">Ir para Leads</button></div>`;
  const aF = C.agg(fh, ix), aH = C.agg(hc, ix);
  const kp = `<div class="kpis">${kpi('Fora do horário', fmtInt(fh.length), `${fmtPct(fh.length, com.length)} dos leads com horário`)}${kpi('Horário comercial', fmtInt(hc.length), `${fmtPct(hc.length, com.length)} dos leads com horário`)}${kpi('Tempo médio · fora', fmtDur(aF.tempoMed), aF.nTempo ? `n=${aF.nTempo}` : 'sem dados')}${kpi('Tempo médio · comercial', fmtDur(aH.tempoMed), aH.nTempo ? `n=${aH.nTempo}` : 'sem dados')}</div>`;
  const cel = (x, n) => `<td class="num">${x} <span class="mut">${fmtPct(x, n)}</span></td>`;
  const linha = (canal, a, per, primeira) => `<tr${primeira ? '' : ''}><td>${primeira ? canal : ''}</td><td class="nw">${per === 'fh' ? 'Fora do horário' : 'Comercial'}</td><td class="num"><b>${a.n}</b>${baixa(a.n, MIN_LEADS)}</td><td class="num">${a.nTempo ? fmtDur(a.tempoMed) + ` <span class="mut">n=${a.nTempo}</span>` + baixa(a.nTempo, MIN_TEMPOS) : '<span class="mut">sem dados</span>'}</td>${cel(a.semResp, a.n)}${cel(a.semTempo, a.n)}${cel(a.opp, a.n)}${cel(a.sql, a.n)}${cel(a.vendas, a.n)}</tr>`;
  const canais = [['ALL', 'Total'], ['GA', 'Google Ads (GA)'], ['META', 'Meta Ads (IG + FB)'], ['IG', 'Instagram (IG)'], ['FB', 'Facebook (FB)'], ['SEM', 'Sem origem']];
  const thead = `<thead><tr><th>Canal</th><th>Período</th><th class="num">Leads</th><th class="num">Tempo de resposta</th><th class="num">Lead não respondeu</th><th class="num">Sem 1ª resposta registrada</th><th class="num">Oportunidade</th><th class="num">SQL</th><th class="num">Venda</th></tr></thead>`;
  let linhas = '';
  for (const [k, nome] of canais) {
    const f = C.agg(C.filtrarOrigem(fh, k), ix), h = C.agg(C.filtrarOrigem(hc, k), ix);
    if (k === 'SEM' && !f.n && !h.n) continue;
    linhas += linha(nome, f, 'fh', true) + linha(nome, h, 'hc', false);
  }
  const tabCanal = `<div class="tw"><table class="t">${thead}<tbody>${linhas}</tbody></table></div><p class="sm mut" style="margin:6px 0 0">Percentuais sobre os leads de cada linha. "Lead não respondeu" = status em que o lead não retornou o contato. "Sem 1ª resposta registrada" = falta o horário do primeiro atendimento.</p>`;
  let tabMes = '';
  if (ui.fhTodos) {
    let lm = '';
    for (const mm of MESES) {
      const f = fh.filter(l => l.mes === mm.key), h = hc.filter(l => l.mes === mm.key); if (!f.length && !h.length) continue;
      lm += linha(mm.nome, C.agg(f, ix), 'fh', true) + linha(mm.nome, C.agg(h, ix), 'hc', false);
    }
    tabMes = `<section class="panel"><h3>Por mês (todos os canais)</h3><p class="hint">Resultados separados por mês</p><div class="tw"><table class="t">${thead.replace('Canal', 'Mês')}<tbody>${lm}</tbody></table></div></section>`;
  }
  const pf = (a, n) => a.n ? C.pctN(n, a.n) : null;
  const taxas = CH.barras({ titulo: 'Taxas por período', cats: ['Oportunidade', 'SQL', 'Venda', 'Lead não respondeu'], fmt: v => fmtNum(v, 1) + '%', axisFmt: v => fmtNum(v, 0) + '%', series: [
    { name: `Fora do horário (n=${aF.n})`, color: CH.COR.FH, values: [pf(aF, aF.opp), pf(aF, aF.sql), pf(aF, aF.vendas), pf(aF, aF.semResp)], opac: aF.n < MIN_LEADS ? [.4, .4, .4, .4] : [] },
    { name: `Horário comercial (n=${aH.n})`, color: CH.COR.HC, values: [pf(aH, aH.opp), pf(aH, aH.sql), pf(aH, aH.vendas), pf(aH, aH.semResp)], opac: aH.n < MIN_LEADS ? [.4, .4, .4, .4] : [] }] });
  const cn = [['GA', 'Google Ads'], ['META', 'Meta Ads'], ['IG', 'Instagram'], ['FB', 'Facebook']];
  const tF = cn.map(([k]) => C.agg(C.filtrarOrigem(fh, k), ix)), tH = cn.map(([k]) => C.agg(C.filtrarOrigem(hc, k), ix));
  const tempos = CH.barras({ titulo: 'Tempo médio por canal e período', cats: cn.map(c => c[1]), fmt: v => fmtDur(v * 60), axisFmt: v => fmtNum(v, 0) + ' h', series: [
    { name: 'Fora do horário', color: CH.COR.FH, values: tF.map(a => a.nTempo ? a.tempoMed / 60 : null), opac: tF.map(a => a.nTempo < MIN_TEMPOS ? .4 : 1) },
    { name: 'Horário comercial', color: CH.COR.HC, values: tH.map(a => a.nTempo ? a.tempoMed / 60 : null), opac: tH.map(a => a.nTempo < MIN_TEMPOS ? .4 : 1) }] });
  let leit;
  if (aF.n < MIN_LEADS || aH.n < MIN_LEADS) leit = `<p><b>Amostra insuficiente para comparar os períodos.</b> Fora do horário: ${aF.n} leads · horário comercial: ${aH.n} leads. É preciso ao menos ${MIN_LEADS} em cada grupo. Os números acima são apenas descritivos e não sustentam conclusão.</p>`;
  else {
    const fr = (nm, x, y) => `<p><b>${nm}:</b> ${fmtPct(x.v, aF.n)} fora do horário (${x.v} de ${aF.n}) × ${fmtPct(y.v, aH.n)} no horário comercial (${y.v} de ${aH.n}); diferença de ${fmtNum(Math.abs(x.v / aF.n - y.v / aH.n) * 100)} p.p.${x.v + y.v < 10 ? ` <span class="badge-low" style="display:inline-block;margin:0">poucos eventos (${x.v + y.v} no total): leitura frágil</span>` : ''}</p>`;
    leit = fr('Oportunidades', { v: aF.opp }, { v: aH.opp }) + fr('SQLs', { v: aF.sql }, { v: aH.sql }) + fr('Vendas', { v: aF.vendas }, { v: aH.vendas }) + fr('Lead não respondeu', { v: aF.semResp }, { v: aH.semResp });
    leit += aF.nTempo >= MIN_TEMPOS && aH.nTempo >= MIN_TEMPOS ? `<p><b>Tempo médio de resposta:</b> ${fmtDur(aF.tempoMed)} fora do horário (n=${aF.nTempo}) × ${fmtDur(aH.tempoMed)} no horário comercial (n=${aH.nTempo}).</p>` : `<p><b>Tempo de resposta:</b> amostra insuficiente (mínimo de ${MIN_TEMPOS} tempos válidos por grupo; há ${aF.nTempo} e ${aH.nTempo}).</p>`;
    leit += `<p class="mut">Leitura descritiva. Diferenças pequenas ou baseadas em poucos eventos podem ser acaso, e este relatório não indica a causa. Compare por canal na tabela acima só quando cada linha tiver amostra suficiente.</p>`;
  }
  return head + cob + kp + `<section class="panel"><h3>Resultados por canal e período</h3><p class="hint">Quantidades e percentuais reais, sem estimativas</p>${tabCanal}</section>` + tabMes +
    `<div class="grid2 gap"><section class="panel"><h3>Taxas: fora do horário × comercial</h3><p class="hint">Percentual dos leads de cada período (todos os canais). Barras claras = amostra insuficiente.</p>${taxas}</section><section class="panel"><h3>Tempo médio de resposta por canal</h3><p class="hint">Barras claras = menos de ${MIN_TEMPOS} tempos válidos</p>${tempos}</section></div>` +
    `<section class="panel leitura"><h3>Leitura dos dados</h3>${leit}</section>`;
}

/* ---------- METAS ---------- */
const META_ROWS = [['leads', 'Leads'], ['opp', 'Oportunidades'], ['sql', 'SQLs'], ['vendas', 'Vendas'], ['desc', 'Descartes']];
function realizados(mes) { const a = C.agg(C.leadsDoMes(S(), mes), idx()); return { a, leads: a.n, opp: a.opp, sql: a.sql, vendas: a.vendas, desc: a.desc }; }
function celulasMeta(k, real, meta, a) {
  const ok = meta != null && meta > 0, p = ok ? real / meta * 100 : null;
  let h = ok ? `<div><b>${fmtNum(p)}%</b> da meta <span class="mut">(${real - meta >= 0 ? '+' : ''}${fmtInt(real - meta)} em relação à meta)</span></div><div class="barra" aria-hidden="true"><i class="${p >= 100 ? 'ok' : ''}" style="width:${Math.min(100, p)}%"></i></div>` : '<span class="mut">Sem meta definida</span>';
  if (k === 'desc') h += `<div class="sm" style="margin-top:4px">Proporção sobre os leads: <b>${fmtPct(real, a.n)}</b></div>`;
  return h;
}
function pageMetas() {
  const mk = ui.metasMes, meta = S().metas[mk] || {}, R = realizados(mk), m = C.mesObj(mk);
  const rows = META_ROWS.map(([k, nome]) => `<tr><td><b>${nome}</b></td><td><input type="number" min="0" step="1" id="meta-${k}" data-k="${k}" value="${meta[k] == null ? '' : meta[k]}" aria-label="Meta de ${nome}" placeholder="—"></td><td class="num" id="real-${k}"><b>${fmtInt(R[k])}</b></td><td id="res-${k}" style="min-width:260px">${celulasMeta(k, R[k], meta[k], R.a)}</td></tr>`).join('');
  return `<div class="head"><h2>Quadro geral de metas</h2><div class="acoes"><label for="metas-mes" class="sr">Mês</label><select id="metas-mes" style="width:auto">${mesOpts(mk)}</select></div></div>
  <div class="nota">Informe as metas de ${m.nome}. O realizado é calculado a partir dos leads cadastrados no mês e o percentual da meta só aparece quando há meta definida.</div>
  <div class="tw"><table class="t metas"><thead><tr><th>Indicador</th><th>Meta do mês</th><th class="num">Realizado</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sm mut">Realizado: Leads = total do mês (sem duplicados) · Oportunidades = classificadas como oportunidade ou SQL · SQLs = classificados como SQL · Vendas = status "ganha" · Descartes = status classificados como descartada.</p>`;
}
function salvarMeta(input) {
  const k = input.dataset.k, mk = ui.metasMes, raw = input.value.trim(), v = raw === '' ? null : Math.max(0, Math.floor(Number(raw)));
  const meta = S().metas[mk] = S().metas[mk] || {}; meta[k] = (v == null || isNaN(v)) ? null : v;
  if (meta[k] == null) input.value = ''; else input.value = meta[k];
  const R = realizados(mk); $('res-' + k).innerHTML = celulasMeta(k, R[k], meta[k], R.a);
  App.salvar();
}

/* ---------- COMPARATIVO ---------- */
function pageCmp() {
  const st = S(), ix = idx(), A = ui.cmpA, B = ui.cmpB, ma = C.mesObj(A), mb = C.mesObj(B);
  const la = C.leadsDoMes(st, A), lb = C.leadsDoMes(st, B);
  const g = (l, o) => C.agg(C.filtrarOrigem(l, o), ix);
  const a = g(la, 'ALL'), b = g(lb, 'ALL'), aG = g(la, 'GA'), bG = g(lb, 'GA'), aM = g(la, 'META'), bM = g(lb, 'META'), aI = g(la, 'IG'), bI = g(lb, 'IG'), aF = g(la, 'FB'), bF = g(lb, 'FB'), aS = g(la, 'SEM'), bS = g(lb, 'SEM');
  const hoje = C.mesDe(C.hojeISO()), parcial = [A, B].filter(k => k === hoje);
  const sel = `<div class="acoes"><label class="sr" for="cmp-a">Primeiro mês</label><select id="cmp-a" style="width:auto">${mesOpts(A)}</select><span class="mut" style="align-self:center">×</span><label class="sr" for="cmp-b">Segundo mês</label><select id="cmp-b" style="width:auto">${mesOpts(B)}</select></div>`;
  const head = `<div class="head"><h2>Comparativo: ${ma.nome} × ${mb.nome}</h2>${sel}</div>`;
  if (A === B) return head + '<div class="nota warn">Escolha dois meses diferentes para comparar.</div>';
  const aviso = parcial.length ? `<div class="nota warn">${parcial.map(k => C.mesObj(k).nome).join(' e ')} ainda está em andamento. Totais de um mês parcial não são comparáveis com um mês completo, então a variação em quantidade fica oculta e vale comparar os percentuais.</div>` : '';
  const vazio = !la.length || !lb.length ? `<div class="nota warn">${!la.length ? ma.nome : mb.nome} ainda não tem leads cadastrados.</div>` : '';
  const sgn = (x, f) => (x > 0 ? '+' : x < 0 ? '−' : '') + f(Math.abs(x));
  const cont = (nome, x, y) => `<tr><td>${nome}</td><td class="num">${fmtInt(x)}</td><td class="num">${fmtInt(y)}</td><td class="num mut">${parcial.length ? '—' : sgn(y - x, fmtInt)}</td></tr>`;
  const taxa = (nome, nx, dx, ny, dy) => { const px = dx ? nx / dx * 100 : null, py = dy ? ny / dy * 100 : null; return `<tr><td>${nome}</td><td class="num">${px == null ? '—' : fmtNum(px) + '%'} <span class="mut">${nx}/${dx}</span></td><td class="num">${py == null ? '—' : fmtNum(py) + '%'} <span class="mut">${ny}/${dy}</span></td><td class="num">${px == null || py == null ? '—' : sgn(py - px, v => fmtNum(v)) + ' p.p.'}</td></tr>`; };
  const tmp = (nome, x, y) => `<tr><td>${nome}</td><td class="num">${x.nTempo ? fmtDur(x.tempoMed) + ` <span class="mut">n=${x.nTempo}</span>` : '<span class="mut">sem dados</span>'}</td><td class="num">${y.nTempo ? fmtDur(y.tempoMed) + ` <span class="mut">n=${y.nTempo}</span>` : '<span class="mut">sem dados</span>'}</td><td class="num">${x.nTempo && y.nTempo ? sgn(y.tempoMed - x.tempoMed, fmtDur) : '—'}</td></tr>`;
  const sec = t => `<tr class="tot"><td colspan="4">${t}</td></tr>`;
  const tabela = `<div class="tw"><table class="t"><thead><tr><th>Indicador</th><th class="num">${ma.nome}</th><th class="num">${mb.nome}</th><th class="num">Variação</th></tr></thead><tbody>${sec('Volume')}${cont('Leads', a.n, b.n)}${cont('Google Ads (GA)', aG.n, bG.n)}${cont('Meta Ads (IG + FB)', aM.n, bM.n)}${cont('Oportunidades', a.opp, b.opp)}${cont('SQLs', a.sql, b.sql)}${cont('Vendas', a.vendas, b.vendas)}${cont('Descartes', a.desc, b.desc)}${cont('Lead não respondeu', a.semResp, b.semResp)}
    ${sec('Conversão do funil (percentual dos leads)')}${taxa('Oportunidades ÷ leads', a.opp, a.n, b.opp, b.n)}${taxa('SQLs ÷ oportunidades', a.sql, a.opp, b.sql, b.opp)}${taxa('Vendas ÷ SQLs', a.vendas, a.sql, b.vendas, b.sql)}${taxa('Vendas ÷ leads', a.vendas, a.n, b.vendas, b.n)}${taxa('Descartes ÷ leads', a.desc, a.n, b.desc, b.n)}${taxa('Lead não respondeu ÷ leads', a.semResp, a.n, b.semResp, b.n)}
    ${sec('Desempenho por origem')}${taxa('Oportunidades ÷ leads · Google Ads', aG.opp, aG.n, bG.opp, bG.n)}${taxa('Oportunidades ÷ leads · Meta Ads', aM.opp, aM.n, bM.opp, bM.n)}${taxa('Vendas ÷ leads · Google Ads', aG.vendas, aG.n, bG.vendas, bG.n)}${taxa('Vendas ÷ leads · Meta Ads', aM.vendas, aM.n, bM.vendas, bM.n)}
    ${sec('Tempo médio de atendimento')}${tmp('Todos os canais', a, b)}${tmp('Google Ads (GA)', aG, bG)}${tmp('Meta Ads (IG + FB)', aM, bM)}${tmp('Instagram (IG)', aI, bI)}${tmp('Facebook (FB)', aF, bF)}</tbody></table></div>`;
  const canal = CH.barras({ titulo: 'Leads por canal', cats: ['Google Ads', 'Instagram', 'Facebook', 'Sem origem'], fmt: v => fmtInt(Math.round(v)), series: [{ name: ma.nome, color: CH.COR.A, values: [aG.n, aI.n, aF.n, aS.n] }, { name: mb.nome, color: CH.COR.B, values: [bG.n, bI.n, bF.n, bS.n] }] });
  const p = (x, n) => n ? C.pctN(x, n) : null;
  const funil = CH.barras({ titulo: 'Conversão do funil', cats: ['Oportunidades', 'SQLs', 'Vendas', 'Descartes', 'Lead não respondeu'], fmt: v => fmtNum(v, 0) + '%', axisFmt: v => fmtNum(v, 0) + '%', series: [
    { name: `${ma.nome} (n=${a.n})`, color: CH.COR.A, values: [p(a.opp, a.n), p(a.sql, a.n), p(a.vendas, a.n), p(a.desc, a.n), p(a.semResp, a.n)] },
    { name: `${mb.nome} (n=${b.n})`, color: CH.COR.B, values: [p(b.opp, b.n), p(b.sql, b.n), p(b.vendas, b.n), p(b.desc, b.n), p(b.semResp, b.n)] }] });
  const tv = x => x.nTempo ? x.tempoMed / 60 : null;
  const tempo = CH.barras({ titulo: 'Tempo médio de atendimento', cats: ['Todos', 'Google Ads', 'Meta Ads', 'Instagram', 'Facebook'], fmt: v => fmtDur(v * 60), axisFmt: v => fmtNum(v, 0) + ' h', series: [
    { name: ma.nome, color: CH.COR.A, values: [tv(a), tv(aG), tv(aM), tv(aI), tv(aF)] }, { name: mb.nome, color: CH.COR.B, values: [tv(b), tv(bG), tv(bM), tv(bI), tv(bF)] }] });
  return head + aviso + vazio + `<section class="panel"><h3>Indicadores lado a lado</h3><p class="hint">Percentuais permitem comparar meses de tamanhos diferentes</p>${tabela}</section>
    <div class="grid2 gap"><section class="panel"><h3>Leads por canal</h3>${canal}</section><section class="panel"><h3>Conversão do funil</h3><p class="hint">Percentual sobre os leads de cada mês</p>${funil}</section></div>
    <section class="panel"><h3>Tempo médio de atendimento por canal</h3><p class="hint">Só entram leads com data e horários de chegada e resposta preenchidos</p>${tempo}</section>`;
}

/* ---------- DADOS E AJUSTES ---------- */
function baixar(nome, texto, tipo) {
  const url = URL.createObjectURL(new Blob([texto], { type: tipo || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function pageDados() {
  const st = S(), ix = idx(), rel = SEED.relatorio || {};
  const uso = n => st.leads.filter(l => norm(l.status) === norm(n)).length;
  const stRows = st.config.status.map((s, i) => `<tr><td><input type="text" value="${esc(s.nome)}" data-st="nome" data-i="${i}" aria-label="Nome do status"></td><td><select data-st="cat" data-i="${i}" aria-label="Categoria">${Object.entries(CAT_NOME).map(([k, v]) => opt(k, v, s.cat)).join('')}</select></td><td class="num">${uso(s.nome)}</td><td><button class="btn sm bad" data-act="status-del" data-i="${i}"${uso(s.nome) ? ' disabled title="Em uso por leads"' : ''}>Excluir</button></td></tr>`).join('');
  const L = st.logos;
  const logo = (k, n) => `<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><div class="logo${L[k] ? ' has' : ''}" style="min-width:150px">${L[k] ? `<img src="${L[k]}" alt="${n}">` : n}</div><button class="btn sm" data-act="logo" data-k="${k}">${L[k] ? 'Trocar' : 'Enviar logotipo'}</button>${L[k] ? `<button class="btn sm" data-act="logo-remove" data-k="${k}">Remover</button>` : ''}</div>`;
  const sepI = rel.setembro || {}, outI = rel.outubro || {};
  return `<div class="head"><h2>Dados e ajustes</h2></div>
  <div class="grid2 gap"><section class="panel"><h3>Backup e restauração</h3><p class="hint">Os dados ficam salvos neste navegador. Exporte um backup de vez em quando e antes de limpar o histórico do navegador.</p>
    <div class="toolbar"><button class="btn pri" data-act="backup-json">Exportar backup (JSON)</button><button class="btn" data-act="restaurar-json">Importar backup…</button></div>
    <div class="toolbar"><button class="btn" data-act="csv-leads-todos">Exportar todos os leads (CSV)</button><button class="btn" data-act="csv-orc-todos">Exportar todos os orçamentos (CSV)</button></div>
    <div class="toolbar"><button class="btn bad" data-act="restaurar-seed">Voltar aos dados originais das planilhas</button></div>
    <p class="sm mut">Voltar aos dados originais apaga o que foi cadastrado ou editado depois da importação.</p></section>
  <section class="panel"><h3>Logotipos</h3><p class="hint">Envie os arquivos oficiais (PNG, JPG, SVG ou WebP, até 1,5 MB). Ficam guardados neste navegador e no backup.</p>${logo('dallminas', 'Dallminas')}${logo('diprotec', 'Diprotec Minas')}</section></div>
  <section class="panel"><h3>Status e categorias</h3><p class="hint">Cada status pertence a uma categoria, e é a categoria que define o que conta como venda, descarte, lead que não respondeu etc. Alterar uma categoria recalcula todos os meses.</p>
    <div class="tw"><table class="t"><thead><tr><th>Status</th><th>Categoria</th><th class="num">Leads</th><th></th></tr></thead><tbody>${stRows}</tbody></table></div>
    <div class="toolbar" style="margin-top:10px"><input type="text" id="st-novo-nome" placeholder="Novo status" style="width:240px" aria-label="Nome do novo status"><select id="st-novo-cat" class="f" aria-label="Categoria do novo status">${Object.entries(CAT_NOME).map(([k, v]) => opt(k, v, 'negociacao')).join('')}</select><button class="btn" data-act="status-add">Adicionar status</button></div></section>
  <section class="panel"><h3>Importação inicial das planilhas</h3>
    <ul class="dq"><li><span>Setembro: linhas na planilha</span><b>${sepI.linhas_csv ?? '—'}</b></li><li><span>Setembro: leads importados</span><b>${sepI.importados ?? '—'}</b></li><li><span>Setembro: linhas vazias ignoradas</span><b>${(sepI.ignoradas || []).length}</b></li><li><span>Outubro: leads importados</span><b>${outI.importados ?? '—'}</b></li><li><span>Outubro: orçamentos importados</span><b>${outI.orcamentos ?? '—'}</b></li></ul>
    <p class="sm mut" style="margin:8px 0 0">Horários de setembro com fuso −05:00 (exportação do Meta) foram convertidos para Brasília (+2 h). O registro original de cada lead continua visível ao abri-lo. Outubro não tinha horários; os campos foram criados vazios.</p></section>`;
}
function stAdd(nome, cat) {
  nome = (nome || '').trim(); if (!nome) { App.toast('Informe o nome do status'); return false; }
  if (S().config.status.some(s => norm(s.nome) === norm(nome))) { App.toast('Esse status já existe'); return false; }
  S().config.status.push({ nome, cat }); App.salvar(); return true;
}
function stChange(el) {
  const i = +el.dataset.i, s = S().config.status[i]; if (!s) return;
  if (el.dataset.st === 'cat') { s.cat = el.value; App.salvar(); App.toast('Categoria atualizada'); return; }
  const novo = el.value.trim();
  if (!novo || S().config.status.some((x, j) => j !== i && norm(x.nome) === norm(novo))) { App.toast(!novo ? 'O nome não pode ficar vazio' : 'Já existe um status com esse nome'); App.render(); return; }
  S().leads.forEach(l => { if (norm(l.status) === norm(s.nome)) l.status = novo; });
  s.nome = novo; App.salvar(); App.render(); App.toast('Status renomeado');
}
function enviarLogo(k) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/svg+xml,image/webp';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (f.size > 1.5 * 1024 * 1024) return App.toast('Arquivo acima de 1,5 MB'); const r = new FileReader(); r.onload = () => { S().logos[k] = r.result; App.salvar(); App.render(); App.toast('Logotipo salvo'); }; r.readAsDataURL(f); };
  inp.click();
}
function importarJSON() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => {
    try { const s = JSON.parse(r.result); if (!(s && s.v === 1 && Array.isArray(s.leads) && Array.isArray(s.orcamentos) && s.config && Array.isArray(s.config.status))) throw 0;
      if (!confirm(`Substituir todos os dados atuais pelo backup (${s.leads.length} leads, ${s.orcamentos.length} orçamentos)?`)) return;
      s.metas = s.metas || {}; s.logos = s.logos || {}; App.state = s; App.salvar(); App.render(); App.toast('Backup importado');
    } catch (e) { App.toast('Arquivo inválido: use um backup exportado por este painel'); } }; r.readAsText(f); };
  inp.click();
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const ov = e.target.classList && e.target.classList.contains('ov'); if (ov) return fechar();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const d = t.dataset, st = S();
  switch (d.act) {
    case 'mes': ui.mes = d.mes; if (!['painel', 'leads', 'orcamentos', 'fora'].includes(ui.page)) ui.page = 'painel'; ui.fQ = ''; App.render(); break;
    case 'pagina': ui.page = d.p; App.render(); window.scrollTo(0, 0); break;
    case 'novo-lead': abrirLead(null); break;
    case 'editar-lead': abrirLead(d.id); break;
    case 'excluir-lead': excluirLead(d.id); break;
    case 'excluir-lead-modal': excluirLead($('lf-id').value); break;
    case 'novo-orc': abrirOrc(null); break;
    case 'editar-orc': abrirOrc(d.id); break;
    case 'excluir-orc': excluirOrc(d.id); break;
    case 'excluir-orc-modal': excluirOrc($('of-id').value); break;
    case 'fechar-modal': fechar(); break;
    case 'toggle-ns': { const b = $('lf-ns'); b.style.display = b.style.display === 'none' ? 'flex' : 'none'; b.hidden = false; if (b.style.display === 'flex') $('lf-ns-nome').focus(); break; }
    case 'add-status-form': { const nome = $('lf-ns-nome').value.trim(); if (stAdd(nome, $('lf-ns-cat').value)) { const sel = $('lf-st'); sel.insertAdjacentHTML('beforeend', opt(nome, nome, nome)); sel.value = nome; $('lf-ns').style.display = 'none'; $('lf-ns-nome').value = ''; sel.dispatchEvent(new Event('change', { bubbles: true })); } break; }
    case 'limpar-filtros': Object.assign(ui, { busca: '', fOrigem: '', fCat: '', fClass: '', fQ: '' }); App.render(); break;
    case 'ver-pend': Object.assign(ui, { busca: '', fOrigem: '', fCat: '', fClass: '', fQ: d.q, page: 'leads' }); App.render(); break;
    case 'fh-escopo': ui.fhTodos = d.v === 'todos'; App.render(); break;
    case 'csv-leads': baixar(`leads_${ui.mes}.csv`, C.leadsCSV(C.leadsDoMes(st, ui.mes), st), 'text/csv;charset=utf-8'); break;
    case 'csv-orc': baixar(`orcamentos_${ui.mes}.csv`, C.orcCSV(C.orcDoMes(st, ui.mes)), 'text/csv;charset=utf-8'); break;
    case 'csv-leads-todos': baixar('leads_todos.csv', C.leadsCSV(st.leads, st), 'text/csv;charset=utf-8'); break;
    case 'csv-orc-todos': baixar('orcamentos_todos.csv', C.orcCSV(st.orcamentos), 'text/csv;charset=utf-8'); break;
    case 'backup-json': baixar(`backup_dashboard_${C.hojeISO()}.json`, JSON.stringify(st), 'application/json'); App.toast('Backup exportado'); break;
    case 'restaurar-json': importarJSON(); break;
    case 'restaurar-seed': if (confirm('Voltar aos dados originais das planilhas? Tudo que foi cadastrado ou editado depois será apagado.') && confirm('Confirma? Faça um backup antes se tiver dúvida.')) { App.state = C.clone(SEED); App.salvar(); App.render(); App.toast('Dados originais restaurados'); } break;
    case 'logo': enviarLogo(d.k); break;
    case 'logo-remove': delete st.logos[d.k]; App.salvar(); App.render(); break;
    case 'status-add': if (stAdd($('st-novo-nome').value, $('st-novo-cat').value)) { App.render(); App.toast('Status adicionado'); } break;
    case 'status-del': { const s = st.config.status[+d.i]; if (s && !st.leads.some(l => norm(l.status) === norm(s.nome))) { st.config.status.splice(+d.i, 1); App.salvar(); App.render(); } break; }
  }
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'lead-form') salvarLead(); else if (e.target.id === 'orc-form') salvarOrc(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal-root').innerHTML) fechar(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-busca') { ui.busca = t.value; App.refreshLeads(); }
  else if (t.closest && t.closest('#lead-form')) calcForm();
});
document.addEventListener('change', e => {
  const t = e.target, id = t.id || '';
  if (id === 'f-origem') { ui.fOrigem = t.value; App.refreshLeads(); }
  else if (id === 'f-cat') { ui.fCat = t.value; App.refreshLeads(); }
  else if (id === 'f-class') { ui.fClass = t.value; App.refreshLeads(); }
  else if (id === 'f-q') { ui.fQ = t.value; App.refreshLeads(); }
  else if (id === 'metas-mes') { ui.metasMes = t.value; App.render(); }
  else if (id === 'cmp-a') { ui.cmpA = t.value; App.render(); }
  else if (id === 'cmp-b') { ui.cmpB = t.value; App.render(); }
  else if (id.startsWith('meta-')) salvarMeta(t);
  else if (t.dataset && t.dataset.st) stChange(t);
  else if (id === 'lf-st') { const c = C.catOf(idx(), t.value); if (c === 'ganha' && !$('lf-cls').value) $('lf-cls').value = 'sql'; calcForm(); }
  else if (id === 'of-st' || id === 'of-res') orcDeps();
  else if (id === 'of-lead') { const l = S().leads.find(x => x.id === t.value); if (l && !$('of-cli').value.trim()) $('of-cli').value = l.empresa || l.nome; }
});

Object.assign(App, { pageOrc, pageFora, pageMetas, pageCmp, pageDados });
App.salvar(); App.render();
})();

</script>
</body>
</html>
